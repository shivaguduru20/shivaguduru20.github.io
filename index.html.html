<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gudurushivaram — Portfolio</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--line:#e4e3dc;--accent:#2f5bea;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1c1c1a;--text:#efeee9;--muted:#9a9990;--line:#2c2c29;--accent:#7b9cff;--accent-t:#0e0e0d}}
:root[data-theme="dark"]{--bg:#121211;--card:#1c1c1a;--text:#efeee9;--muted:#9a9990;--line:#2c2c29;--accent:#7b9cff;--accent-t:#0e0e0d}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:700;text-decoration:none}
nav{display:flex;gap:18px;align-items:center;font-size:14px}
nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--text)}
#theme{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:3px 9px;cursor:pointer}
.hero{padding:88px 0 56px}
.hero small{color:var(--accent);font-weight:600;letter-spacing:.04em}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.1;margin:10px 0 16px}
.hero p{max-width:560px;color:var(--muted);font-size:18px;margin:0 0 26px}
.btn{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--accent);color:var(--accent-t);text-decoration:none;font-weight:600;margin-right:10px}
.btn.alt{background:none;color:var(--text);border:1px solid var(--line)}
section{padding:48px 0}
h2{font-size:26px;margin:0 0 20px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:none;color:var(--text);padding:5px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.card.has-shot{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.body{display:flex;flex-direction:column;gap:10px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.flow span{border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.flow i{color:var(--muted);font-style:normal}
@media (max-width:700px){.card.has-shot{display:flex;flex-direction:column}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--muted)}
.links{display:flex;gap:14px;font-size:14px}
.links a{color:var(--accent);font-weight:600;text-decoration:none}
.skills{display:flex;flex-wrap:wrap;gap:10px}
.skills span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:900px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600}
.mbar button{margin-left:8px}
.shot{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
#codeview img{max-width:100%;display:block;margin:0 0 12px;border-radius:8px}
#codeview{margin:0;padding:16px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;user-select:text}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#top" id="logo"></a>
  <nav><a href="#projects">Projects</a><a href="#about">About</a><a href="#contact">Contact</a><button id="theme" aria-label="Toggle theme">◐</button></nav>
</div></header>

<main id="top" class="wrap">
  <div class="hero">
    <small id="role"></small>
    <h1 id="headline"></h1>
    <p id="tagline"></p>
    <a class="btn" href="#projects">View my work</a><a class="btn alt" href="#contact">Get in touch</a>
  </div>

  <section id="projects">
    <h2>Projects</h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="about">
    <h2>About me</h2>
    <p id="about-text" style="max-width:640px;color:var(--muted)"></p>
    <div class="skills" id="skills"></div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p id="contact-text" style="color:var(--muted)"></p>
    <div id="contact-links"></div>
  </section>
</main>
<footer id="foot"></footer>

<div class="modal" id="modal" hidden><div class="mbox">
  <div class="mbar"><span id="mtitle"></span><span><button class="chip" id="mcopy">Copy</button><button class="chip" id="mclose">Close</button></span></div>
  <pre id="codeview"></pre>
</div></div>

def remove_noise(audio, sr):
    noise_profile = audio[:int(0.5 * sr)]
    noise_reduced_audio = librosa.effects.remix(audio, intervals=librosa.effects.split(audio, top_db=20))
    return noise_reduced_audio


def load_audio_with_features(path, categories, model_folder):
    X_file = os.path.join(model_folder, "X.npy")
    Y_file = os.path.join(model_folder, "Y.npy")

    if os.path.exists(X_file) and os.path.exists(Y_file):
        print(f"Loading cached data from {model_folder}")
        X = np.load(X_file)
        Y = np.load(Y_file)
    else:
        print(f"Path does not exist: {path}" if not os.path.exists(path) else "Processing directory")
        X = []
        Y = []

        for root, dirs, files in os.walk(path):
            print(f"Processing root: {root}")
            for file in files:
                name = os.path.basename(root)
                if file.endswith('.wav'):
                    file_path = os.path.join(root, file)
                    try:
                        y, sr = librosa.load(file_path, sr=None)  # Load the audio file

                        # Extracting 10 different features
                        mfccs = np.mean(librosa.feature.mfcc(y=y, sr=sr, n_mfcc=30).T, axis=0)
                        chroma = np.mean(librosa.feature.chroma_stft(y=y, sr=sr).T, axis=0)
                        mel = np.mean(librosa.feature.melspectrogram(y=y, sr=sr).T, axis=0)
                        spectral_contrast = np.mean(librosa.feature.spectral_contrast(y=y, sr=sr).T, axis=0)
                        tonnetz = np.mean(librosa.feature.tonnetz(y=librosa.effects.harmonic(y), sr=sr).T, axis=0)
                        rms = np.mean(librosa.feature.rms(y=y).T, axis=0)
                        spectral_bandwidth = np.mean(librosa.feature.spectral_bandwidth(y=y, sr=sr).T, axis=0)
                        spectral_centroid = np.mean(librosa.feature.spectral_centroid(y=y, sr=sr).T, axis=0)
                        spectral_rolloff = np.mean(librosa.feature.spectral_rolloff(y=y, sr=sr).T, axis=0)
                        zero_crossing_rate = np.mean(librosa.feature.zero_crossing_rate(y=y).T, axis=0)

                        # Concatenating features into a single vector
                        feature_vector = np.hstack([
                            mfccs, chroma, mel, spectral_contrast, tonnetz,
                            rms, spectral_bandwidth, spectral_centroid, spectral_rolloff, zero_crossing_rate
                        ])

                        X.append(feature_vector)
                        if name in categories:
                            Y.append(categories.index(name))
                        else:
                            print(f"Category {name} not in categories list.")
                    except Exception as e:
                        print(f"Skipping {file_path}, error reading file: {e}")

        X = np.array(X)
        Y = np.array(Y)
        os.makedirs(model_folder, exist_ok=True)  # Ensure the directory exists
        np.save(X_file, X)
        np.save(Y_file, Y)

    return X, Y

def preprocess_audio(audio_path):
    try:
        audio, sr = librosa.load(audio_path, sr=None)

        # Extracting 10 different features
        mfccs = np.mean(librosa.feature.mfcc(y=audio, sr=sr, n_mfcc=30).T, axis=0)
        chroma = np.mean(librosa.feature.chroma_stft(y=audio, sr=sr).T, axis=0)
        mel = np.mean(librosa.feature.melspectrogram(y=audio, sr=sr).T, axis=0)
        spectral_contrast = np.mean(librosa.feature.spectral_contrast(y=audio, sr=sr).T, axis=0)
        tonnetz = np.mean(librosa.feature.tonnetz(y=librosa.effects.harmonic(audio), sr=sr).T, axis=0)
        rms = np.mean(librosa.feature.rms(y=audio).T, axis=0)
        spectral_bandwidth = np.mean(librosa.feature.spectral_bandwidth(y=audio, sr=sr).T, axis=0)
        spectral_centroid = np.mean(librosa.feature.spectral_centroid(y=audio, sr=sr).T, axis=0)
        spectral_rolloff = np.mean(librosa.feature.spectral_rolloff(y=audio, sr=sr).T, axis=0)
        zero_crossing_rate = np.mean(librosa.feature.zero_crossing_rate(y=audio).T, axis=0)

        # Concatenating features into a single vector
        feature_vector = np.hstack([
            mfccs, chroma, mel, spectral_contrast, tonnetz,
            rms, spectral_bandwidth, spectral_centroid, spectral_rolloff, zero_crossing_rate
        ])

        return feature_vector

    except Exception as e:
        print(f"Error processing {audio_path}: {e}")
        return None

    librosa.display.waveshow(y, sr=sr)
    plt.xlabel('Time (s)')
    plt.ylabel('Amplitude')

    # Save plot to an image buffer
    plt.savefig("waveplot.png")
    plt.close()

    # Load the saved waveplot image
    waveplot_img = cv2.imread("waveplot.png")
    if waveplot_img is not None:
        # Add the predicted category text on the waveplot
        font = cv2.FONT_HERSHEY_SIMPLEX
        position = (50, 50)  # Position to place the text
        font_scale = 1
        font_color = (0, 0, 255)  # Red color in BGR
        thickness = 2
        line_type = cv2.LINE_AA

        cv2.putText(waveplot_img, f"Predicted: {predicted_category}", position, font, font_scale, font_color, thickness, line_type)

        # Display the waveplot with annotation
        cv2.imshow("Waveplot with Prediction", waveplot_img)
        cv2.waitKey(0)
        cv2.destroyAllWindows()
